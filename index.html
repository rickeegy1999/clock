<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer, stopwatch and alarms</title>

<!-- PWA & iPadOS Full-Screen Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#171a21;--line:#262b35;--text:#e8eaf0;--mute:#8a92a3;--accent:#6ea8ff;--danger:#ff6b6b;--ok:#5ad19a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
nav{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px;margin-bottom:20px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px;border-radius:9px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--line);color:var(--text)}
section{display:none}section.on{display:block}
.big{font:300 clamp(48px,16vw,84px)/1 "Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;margin:18px 0 22px;letter-spacing:-.02em}
.big small{font-size:.4em;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button{cursor:pointer}button:hover{border-color:var(--mute)}
button.p{background:var(--accent);border-color:var(--accent);color:#08101f;font-weight:600}
button.d{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hms{display:flex;gap:8px;justify-content:center;align-items:center}
.hms label{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:12px}
.hms input{width:76px;text-align:center;font-size:22px}
.adj{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:14px}
.adj input[type=number]{width:72px}
.adj span{color:var(--mute);font-size:13px;width:100%;text-align:center}
.laps{list-style:none;padding:0;margin:14px 0 0}
.laps li{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.laps li span:first-child{color:var(--mute)}
.alarm{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.alarm.pinned,.pin.on{border-color:var(--accent)}.pin.on{color:var(--accent)}
.alarm.off{opacity:.55}
.ahead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.at{display:flex;align-items:center;gap:6px;flex:1 1 100%;font-size:clamp(28px,9vw,56px);color:var(--mute)}.at input{flex:1;min-width:0;width:0;text-align:center;font-size:inherit;font-weight:300;padding:10px 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}.at input::-webkit-inner-spin-button,.at input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.at select{font-size:clamp(16px,4.5vw,24px);padding:10px 8px}
.ahead input[type=text]{flex:1;min-width:100px}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mute);position:relative}.ahead .tog input[type=checkbox]{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}.tog i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .15s}.tog input:checked+i{background:var(--ok)}.tog input:checked+i::after{transform:translateX(18px);background:#08101f}.tog input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}.tog b{font-weight:500;min-width:26px}
.alarm .adj{background:none;border:0;border-top:1px solid var(--line);border-radius:0;margin-top:10px;padding:10px 0 0;justify-content:flex-start}
.tools{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:28px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
#ring{position:sticky;top:0;display:none;align-items:center;justify-content:space-between;gap:10px;background:#1a0505;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600;z-index:5}
#ring.on{display:flex}#ring button{background:var(--danger);color:#1a0505;border:0;font-weight:600}
html.ringing,html.ringing body{background:#c62828}
html.ringing .big,html.ringing .empty,html.ringing nav button[aria-selected=false],html.ringing .tools{color:#fff}
.empty{color:var(--mute);text-align:center;padding:18px}
</style>
</head>
<body>
<main>
<div id="ring" role="alert"><span id="ringMsg">Ringing</span><button id="stopRing">Stop</button></div>

<nav role="tablist">
<button role="tab" data-t="timer" aria-selected="true">Timer</button>
<button role="tab" data-t="sw" aria-selected="false">Stopwatch</button>
<button role="tab" data-t="al" aria-selected="false">Alarms</button>
</nav>

<section id="timer" class="on">
<div class="hms" id="tIn">
<label>Hours<input type="number" min="0" max="99" value="0" id="th"></label>
<label>Minutes<input type="number" min="0" max="999" value="5" id="tm"></label>
<label>Seconds<input type="number" min="0" max="999" value="0" id="ts"></label>
</div>
<div class="big" id="tDisp">00:05:00</div>
<div class="row">
<button class="p" id="tGo">Start</button>
<button id="tReset">Reset</button>
</div>
<div class="adj" data-for="timer"></div>
</section>

<section id="sw">
<div class="big" id="sDisp">00:00:00<small>.0</small></div>
<div class="row">
<button class="p" id="sGo">Start</button>
<button id="sLap" disabled>Lap</button>
<button id="sReset">Reset</button>
</div>
<div class="adj" data-for="sw"></div>
<ul class="laps" id="laps"></ul>
</section>

<section id="al">
<div class="row"><button class="p" id="aAdd">Add alarm</button><select id="fmt" aria-label="Time format"><option value="24">24-hour</option><option value="12">12-hour (AM/PM)</option></select></div>
<div id="aList"></div>
</section>

<div class="tools">
<button id="ringNow">Ring now</button>
<span id="audioInfo">Sound: alarmclock.mp3</span>
<label>Use a different file <input type="file" accept="audio/*" id="file" style="max-width:190px"></label>
</div>
</main>

<script>
const $=s=>document.querySelector(s), UNIT={s:1000,m:60000,h:3600000};
const pad=n=>String(n).padStart(2,"0");
const hms=ms=>{const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60)};

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
});

/* ---------- sound ---------- */
const audio=new Audio("alarmclock.mp3");audio.loop=true;
let ringing=false,beepTimer=null,ac=null;
function startBeep(){
  if(beepTimer)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const b=()=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.4)};
  b();beepTimer=setInterval(b,600);
}
audio.addEventListener("error",()=>{$("#audioInfo").textContent="alarmclock.mp3 not found, using beep";if(ringing)startBeep()});
function ring(msg){
  if(ringing)return;ringing=true;
  $("#ringMsg").textContent=msg||"Ringing";$("#ring").classList.add("on");document.documentElement.classList.add("ringing");
  audio.currentTime=0;
  const p=audio.play();if(p&&p.catch)p.catch(startBeep);
}
function stopRing(){
  ringing=false;audio.pause();clearInterval(beepTimer);beepTimer=null;$("#ring").classList.remove("on");document.documentElement.classList.remove("ringing");
}
$("#stopRing").onclick=stopRing;
$("#ringNow").onclick=()=>ringing?stopRing():ring("Ringing");
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;audio.src=URL.createObjectURL(f);$("#audioInfo").textContent="Sound: "+f.name};

/* ---------- shared adjust controls ---------- */
document.querySelectorAll(".adj[data-for]").forEach(el=>el.innerHTML=adjHTML());
function adjHTML(extra){return `<span>Add or subtract time</span>
<select class="sign"><option value="1">Add</option><option value="-1">Subtract</option></select>
<input type="number" class="num" min="0" value="1" aria-label="Amount">
<select class="unit"><option value="s">seconds</option><option value="m" selected>minutes</option><option value="h">hours</option></select>
<button class="apply">Apply</button>`}
function readAdj(el){return (+el.querySelector(".sign").value)*Math.max(0,+el.querySelector(".num").value||0)*UNIT[el.querySelector(".unit").value]}

/* ---------- timer ---------- */
const T={rem:300000,end:0,running:false,done:false};
function tSetFromInputs(){T.rem=((+$("#th").value||0)*3600+(+$("#tm").value||0)*60+(+$("#ts").value||0))*1000;T.done=false;tDraw()}
["th","tm","ts"].forEach(i=>$("#"+i).oninput=()=>{if(!T.running)tSetFromInputs()});
const tLeft=()=>T.running?Math.max(0,T.end-Date.now()):T.rem;
function tDraw(){
  $("#tDisp").textContent=hms(Math.ceil(tLeft()/1000)*1000);
  $("#tGo").textContent=T.running?"Pause":"Start";
  $("#tIn").style.display=(T.running||T.done)?"none":"flex";
}
$("#tGo").onclick=()=>{
  if(T.running){T.rem=tLeft();T.running=false}
  else{if(T.done){stopRing();T.done=false}if(T.rem<=0){tSetFromInputs()}if(T.rem<=0)return;T.end=Date.now()+T.rem;T.running=true}
  tDraw();
};
$("#tReset").onclick=()=>{T.running=false;stopRing();tSetFromInputs()};
document.querySelector('.adj[data-for="timer"] .apply').onclick=()=>{
  const d=readAdj(document.querySelector('.adj[data-for="timer"]'));
  if(T.running)T.end+=d;else T.rem=Math.max(0,T.rem+d);
  tDraw();
};

/* ---------- stopwatch ---------- */
const S={acc:0,start:0,running:false,laps:[],lastLap:0};
const sNow=()=>Math.max(0,S.running?S.acc+Date.now()-S.start:S.acc);
function sDraw(){
  const ms=sNow();$("#sDisp").innerHTML=hms(ms)+"<small>."+Math.floor(ms%1000/100)+"</small>";
  $("#sGo").textContent=S.running?"Pause":"Start";$("#sLap").disabled=!S.running;
}
$("#sGo").onclick=()=>{if(S.running){S.acc=sNow();S.running=false}else{S.start=Date.now();S.running=true}sDraw()};
$("#sReset").onclick=()=>{S.acc=0;S.running=false;S.laps=[];S.lastLap=0;drawLaps();sDraw()};
$("#sLap").onclick=()=>{const t=sNow();S.laps.unshift({n:S.laps.length+1,split:t-S.lastLap,total:t});S.lastLap=t;drawLaps()};
function drawLaps(){$("#laps").innerHTML=S.laps.map(l=>`<li><span>Lap ${l.n}</span><span>${hms(l.split)}.${Math.floor(l.split%1000/100)}</span><span>${hms(l.total)}</span></li>`).join("")}
document.querySelector('.adj[data-for="sw"] .apply').onclick=()=>{
  const d=readAdj(document.querySelector('.adj[data-for="sw"]'));
  if(S.running){S.acc+=d;if(S.acc+Date.now()-S.start<0)S.acc=S.start-Date.now()}
  else S.acc=Math.max(0,S.acc+d);
  sDraw();
};

/* ---------- alarms ---------- */
let H12=false;try{H12=localStorage.getItem("fmt")==="12"}catch(e){}
const fmtT=t=>{if(!H12)return tStr(t);const h=Math.floor(t/3600);return pad(h%12||12)+tStr(t).slice(2)+(h>=12?" PM":" AM")};
let alarms=[];
try{alarms=JSON.parse(localStorage.getItem("alarms")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("alarms",JSON.stringify(alarms.map(a=>({t:a.t,label:a.label,on:a.on,pin:!!a.pin}))))}catch(e){}};
const tStr=t=>pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);
const parseT=v=>{const p=v.split(":").map(Number);return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0)};
function drawAlarms(){
  const box=$("#aList");
  if(!alarms.length){box.innerHTML='<div class="empty">No alarms yet. Add one to get started.</div>';return}
  box.innerHTML="";
  alarms.slice().sort((x,y)=>(y.pin?1:0)-(x.pin?1:0)||x.t-y.t).forEach(a=>{
    const el=document.createElement("div");el.className="alarm"+(a.on?"":" off");a.el=el;el.classList.toggle("pinned",!!a.pin);
    el.innerHTML=`<div class="ahead">
      <span class="at" title="Hours, minutes, seconds"><input type="number" aria-label="Hour">:<input type="number" min="0" max="59" aria-label="Minute">:<input type="number" min="0" max="59" aria-label="Second"><select class="ap" aria-label="AM or PM"><option>AM</option><option>PM</option></select></span>
      <input type="text" placeholder="Label" value="${(a.label||"").replace(/"/g,"&quot;")}">
      <label class="tog"><input type="checkbox" ${a.on?"checked":""} aria-label="Alarm on or off"><i></i><b>${a.on?"On":"Off"}</b></label>
      <button class="pin${a.pin?" on":""}">${a.pin?"Pinned":"Pin"}</button><button class="d del">Delete</button></div>
      <div class="adj"><span>Shift this alarm</span>
      <select class="src"><option value="c">Custom amount</option><option value="t">Timer time left</option><option value="s">Stopwatch time ran</option></select>
      <span style="display:none"></span>
      <input type="number" class="num" min="0" value="1" aria-label="Amount">
      <select class="unit"><option value="s">seconds</option><option value="m" selected>minutes</option><option value="h">hours</option></select>
      <button class="plus">Add</button><button class="minus">Subtract</button></div>`;
    const [hI,mI,sI,label,chk]=el.querySelectorAll(".ahead input");
    const ap=el.querySelector(".ap");
    hI.min=H12?1:0;hI.max=H12?12:23;ap.style.display=H12?"":"none";
    const setT=()=>{let h=Math.floor(a.t/3600);if(H12){ap.value=h>=12?"PM":"AM";h=h%12||12}hI.value=pad(h);mI.value=pad(Math.floor(a.t%3600/60));sI.value=pad(a.t%60)};setT();
    const rd=()=>{let h=+hI.value||0;if(H12)h=Math.min(12,Math.max(1,h))%12+(ap.value==="PM"?12:0);else h=Math.min(23,Math.max(0,h));a.t=h*3600+Math.min(59,Math.max(0,+mI.value||0))*60+Math.min(59,Math.max(0,+sI.value||0));a.fired=null;save()};
    [hI,mI,sI,ap].forEach(i=>i.onchange=()=>{rd();setT()});
    label.oninput=()=>{a.label=label.value;save()};
    chk.onchange=()=>{a.on=chk.checked;a.fired=null;el.classList.toggle("off",!a.on);el.querySelector(".tog b").textContent=a.on?"On":"Off";save()};
    el.querySelector(".del").onclick=()=>{alarms.splice(alarms.indexOf(a),1);save();drawAlarms()};
    el.querySelector(".pin").onclick=()=>{const was=a.pin;alarms.forEach(x=>x.pin=false);a.pin=!was;save();drawAlarms()};
    const src=el.querySelector(".src"),num=el.querySelector(".num"),unit=el.querySelector(".unit");
    src.onchange=()=>{num.disabled=unit.disabled=src.value!=="c"};
    const shift=sign=>{
      const sec=src.value==="t"?Math.round(tLeft()/1000):src.value==="s"?Math.round(sNow()/1000):Math.round((+num.value||0)*UNIT[unit.value]/1000);
      a.t=(((a.t+sign*sec)%86400)+86400)%86400;a.fired=null;setT();save();resort();
    };
    el.querySelector(".plus").onclick=()=>shift(1);
    el.querySelector(".minus").onclick=()=>shift(-1);
    box.appendChild(el);
  });
}
$("#fmt").value=H12?"12":"24";
$("#fmt").onchange=()=>{H12=$("#fmt").value==="12";try{localStorage.setItem("fmt",H12?"12":"24")}catch(e){}drawAlarms()};
$("#aAdd").onclick=()=>{const d=new Date();alarms.push({t:(d.getHours()*3600+d.getMinutes()*60+600)%86400,label:"",on:true});save();drawAlarms()};
function resort(){const box=$("#aList");alarms.slice().sort((x,y)=>(y.pin?1:0)-(x.pin?1:0)||x.t-y.t).forEach(a=>a.el&&box.appendChild(a.el))}
function checkAlarms(){
  const d=new Date(),secs=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),key=d.toDateString();
  alarms.forEach(a=>{
    if(a.on&&a.fired!==key&&secs>=a.t&&secs-a.t<5){a.fired=key;ring(a.label?"Alarm: "+a.label:"Alarm "+fmtT(a.t))}
  });
}

/* ---------- tick ---------- */
setInterval(()=>{
  if(T.running&&tLeft()<=0){T.running=false;T.rem=0;T.done=true;ring("Timer finished")}
  tDraw();sDraw();checkAlarms();
},100);
tSetFromInputs();drawAlarms();sDraw();

/* ---------- PWA Service Worker Registration ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.error("SW failed:", err));
  });
}
</script>
</body>
</html>
